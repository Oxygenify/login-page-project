<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

        <script src="script.js" defer></script>
        
        <title>Login or Sign Up</title>
    </head>
    <body>
        <h1>John Website</h1>

        <section id="login-container">
            <h2>Welcome Back!</h2>
            <p class="sub-sentence">Please log in to your account.</p>
           
            <div class="form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>
           
            <div class="form">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>

            <button type="submit">Log In</button>

            <p>Or log in with:</p>
            <div class="social-login">
                <button class="app1-login"> <img src="./assets/9391714.png" width="40" height="40"> App1</button>
                <button class="app2-login"> <img src="./assets/9391714.png" width="40" height="40"> App2</button>
            </div>

            <p class="change-mode">Don't have an account? <a href="#sign-up-container">Sign up</a>.</p>
        </section>

        <section id="sign-up-container" hidden>
            <h2>Create an Account</h2>
            <p class="sub-sentence">Please fill in the form to create an account.</p>
            
            <div class="form">
                <label for="new-username">Username:</label>
            <input type="text" id="new-username" name="new-username" placeholder="Choose a username">
            </div>
            
            <div class="form">
                <label for="new-password">Password:</label>
                <input type="password" id="new-password" name="new-password" placeholder="Choose a password">
            </div>

            <button type="submit">Sign Up</button>

            <p>Or sign up with:</p>
            <div class="social-login">
                <button class="app1-login"> <img src="./assets/9391714.png" width="40" height="40"> App1</button>
                <button class="app2-login"> <img src="./assets/9391714.png" width="40" height="40"> App2</button>
            </div>

            <p class="change-mode">Already have an account? <a href="#login-container">Log in</a>.</p>
        </section>
    </body>
</html>
