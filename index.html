<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

        <script src="script.js" defer></script>

        <title>Login or Sign Up</title>
    </head>
    <body>
        <h1>John Website</h1>

        <div id="login">
            <h2>Welcome Back!</h2>
            <p class="sub-sentence">Please log in to your account.</p>
           
            <form>
                <div class="form">
                    <label for="username">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </label>
                    <input type="text" id="username" name="username" placeholder="Enter your username">
                </div>

                <div class="form">
                    <label for="email">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                        </svg>
                    </label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>
            
                <div class="form">
                    <label for="password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>

                <button type="submit">Log In</button>
            </form>

            <p>Or log in with:</p>
            <div class="social-login">
                <button class="app1-login"> <img src="./assets/9391714.png" width="40" height="40"> App1</button>
                <button class="app2-login"> <img src="./assets/9391714.png" width="40" height="40"> App2</button>
            </div>

            <p class="change-login-mode">Don't have an account? <a href="#signup">Sign up</a>.</p>
        </div>

        <div id="signup" hidden>
            <h2>Create an Account</h2>
            <p class="sub-sentence">Please fill in the form to create an account.</p>
            
            <form>
                <div class="form">
                    <label for="new-username">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </label>
                    <input type="text" id="new-username" name="new-username" placeholder="Choose a username">
                </div>
                
                <div class="form">
                    <label for="new-email">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
                        </svg>
                    </label>
                    <input type="email" id="new-email" name="new-email" placeholder="Enter your email">
                </div>

                <div class="form">
                    <label for="new-password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </label>
                    <input type="password" id="new-password" name="new-password" placeholder="Enter a password">
                </div>

                <button type="submit">Sign Up</button>
            </form>

            <p>Or sign up with:</p>
            <div class="social-login">
                <button class="app1-login"> <img src="./assets/9391714.png" width="40" height="40"> App1</button>
                <button class="app2-login"> <img src="./assets/9391714.png" width="40" height="40"> App2</button>
            </div>

            <p class="change-login-mode">Already have an account? <a href="#login">Log in</a>.</p>
        </div>

        <div id="toggler" class="view-toggler" role="button" tabindex="0" aria-label="Switch to dark mode" aria-pressed="false">
            <div class="lever"></div>

            <div class="icons-wrapper">
                <svg class="icon moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
                <svg class="icon sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="black" stroke-width="2" stroke-linecap="round" />
                </svg>
            </div>
        </div>
    </body>
</html>
