<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

        <script src="script.js" defer></script>

        <title>Login or Sign Up</title>
    </head>
    <body>
        <h1>John Website</h1>

        <div id="login">
            <h2>Welcome Back!</h2>
            <p class="sub-sentence">Please log in to your account.</p>
           
            <div class="form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>
           
            <div class="form">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
            </div>

            <button type="submit">Log In</button>

            <p>Or log in with:</p>
            <div class="social-login">
                <button class="app1-login"> <img src="./assets/9391714.png" width="40" height="40"> App1</button>
                <button class="app2-login"> <img src="./assets/9391714.png" width="40" height="40"> App2</button>
            </div>

            <p class="change-login-mode">Don't have an account? <a href="#signup">Sign up</a>.</p>
        </div>

        <div id="signup" hidden>
            <h2>Create an Account</h2>
            <p class="sub-sentence">Please fill in the form to create an account.</p>
            
            <div class="form">
                <label for="new-username">Username:</label>
                <input type="text" id="new-username" name="new-username" placeholder="Choose a username">
            </div>
            
            <div class="form">
                <label for="new-password">Password:</label>
                <input type="password" id="new-password" name="new-password" placeholder="Choose a password">
            </div>

            <button type="submit">Sign Up</button>

            <p>Or sign up with:</p>
            <div class="social-login">
                <button class="app1-login"> <img src="./assets/9391714.png" width="40" height="40"> App1</button>
                <button class="app2-login"> <img src="./assets/9391714.png" width="40" height="40"> App2</button>
            </div>

            <p class="change-login-mode">Already have an account? <a href="#login">Log in</a>.</p>
        </div>

        <div id="toggler" class="view-toggler" role="button" tabindex="0" aria-label="Switch to dark mode" aria-pressed="false">
            <div class="lever"></div>

            <div class="icons-wrapper">
                <svg class="icon moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
                <svg class="icon sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="black" stroke-width="2" stroke-linecap="round" />
                </svg>
            </div>
        </div>
    </body>
</html>
